schema_version: 1

storage:
  driver: oss
  bucket: ${OSS_BUCKET}
  region: cn-chengdu
  prefix: ""
  use_internal_endpoint: false

# 发布源文件只允许来自配置文件旁的 dist/；清单由工具写入 .distkeeper/。
safety:
  allowed_source_roots:
    - dist
  allowed_write_prefixes:
    - dist
    - .distkeeper

repositories:
  psygo:
    artifact_name: psygo
    channels:
      - stable
    targets:
      android:
        platform: android
        arch: universal
        extensions:
          - .apk
        content_type: application/vnd.android.package-archive
        versioned_key: dist/Android/{artifact}-{version}{extension}
        latest_key: dist/Android/{artifact}{extension}

      windows-x64:
        platform: windows
        arch: x64
        extensions:
          - .exe
          - .msi
          - .zip
        versioned_key: dist/Windows/{artifact}-{version}-windows-x64{extension}
        latest_key: dist/Windows/{artifact}-windows-x64{extension}

      linux-x64:
        platform: linux
        arch: x64
        extensions:
          - .AppImage
          - .deb
          - .rpm
          - .tar.gz
        versioned_key: dist/Linux/{artifact}-{version}-linux-x64{extension}
        latest_key: dist/Linux/{artifact}-linux-x64{extension}
