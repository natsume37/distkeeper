[project]
name = "distkeeper"
version = "0.1.0"
description = "Configurable release artifact versioning for object storage"
readme = "README.md"
authors = [
    { name = "Martin" }
]
requires-python = ">=3.12"
dependencies = [
    "alibabacloud-oss-v2>=1.3.2",
    "packaging>=26.3",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
distkeeper = "distkeeper.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alibabacloud_oss_v2", "alibabacloud_oss_v2.*"]
ignore_missing_imports = true
